# Flux panic-verification pipeline — Invariants 0 + 1 + 2
#
# Runs on every push commit. In sequence:
#   0. python3 tools/reannotate_flux.py --survey tools/panic_survey.json --dry-run
#      — audits all // FLUX- annotations against the committed survey;
#      exits 1 on violations (orphan/malformed markers)
#   1. python3 tools/check_invariant1.py  — reads tools/panic_survey.json
#      (committed) + source annotations; writes tools/invariant1_report.json
#   2. python3 tools/check_invariant2.py  — builds Flux from the `flux/`
#      submodule (flux-rs/flux), runs the no-vacuity gate.
# The job passes iff check_invariant2.py exits 0 (summary: ... gate=pass).

name: flux-invariant2

on:
  push:

jobs:
  # ------------------------------------------------------------------------ #
  # Freshness gate: the committed tools/panic_survey.json is a *build product*
  # of the release binary. Every downstream tool (reannotate_flux.py,
  # check_invariant1/2.py) reads it as ground truth, so a stale survey makes
  # the whole pipeline audit against the wrong binary. This job rebuilds the
  # board, regenerates the survey, and fails if the committed copy no longer
  # matches the current source (address-independent comparison — absolute
  # addresses legitimately drift across hosts and are ignored).
  #
  # Uses Tock's own rust-toolchain.toml (NOT Flux's), so it must stay a
  # separate job from flux-invariant2, which swaps that file out.
  # ------------------------------------------------------------------------ #
  panic-survey-fresh:
    runs-on: ubuntu-latest
    steps:
      # The Flux compiler lives in the `flux/` git submodule (flux-rs/flux).
      # `submodules: recursive` checks it out at the pinned commit so the
      # flux-rs / flux-core path dependencies in the workspace Cargo.toml
      # files resolve — even though this job builds with Tock's own toolchain
      # (NOT `cargo flux`), those crates must still resolve for the manifest
      # to load.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM binutils (objdump + addr2line)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Install Tock Rust toolchain and embedded target
        run: |
          rustup show
          rustup target add thumbv7em-none-eabi

      # ------------------------------------------------------------------ #
      # panic_survey.py demangles bl-target symbols with rustfilt to match
      # them against the demangled sink names in tools/symbols.txt. Without
      # rustfilt it falls back to an identity map and matches only the one
      # already-unmangled sink (rust_begin_unwind), so the survey collapses
      # to 1 site and the freshness comparison spuriously reports STALE.
      # ------------------------------------------------------------------ #
      - name: Install rustfilt
        run: cargo install rustfilt

      - name: Build the nrf52840dk release binary
        working-directory: boards/nordic/nrf52840dk
        run: make release

      - name: Regenerate survey and compare against the committed copy
        run: |
          python3 tools/panic_survey.py \
            --skip-build \
            --objdump arm-none-eabi-objdump \
            --addr2line arm-none-eabi-addr2line \
            --out /tmp/fresh_survey.json
          python3 tools/check_survey_fresh.py tools/panic_survey.json /tmp/fresh_survey.json

  flux-invariant2:
    runs-on: ubuntu-latest

    # Flux lives in the `flux/` git submodule (flux-rs/flux, pinned commit).
    env:
      FLUX_DIR: ${{ github.workspace }}/flux

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------------ #
      # Install fixpoint (SMT constraint solver used by Flux)
      # Mirrors the install-fixpoint action from the Flux repo's CI.
      # ------------------------------------------------------------------ #
      - name: Install fixpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NAME="fixpoint-x86_64-linux-gnu.tar.gz"
          URL="https://github.com/ucsd-progsys/liquid-fixpoint/releases/download/nightly/${NAME}"
          echo "Downloading fixpoint from ${URL}"
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" --retry 3 \
            -o "${NAME}" "${URL}"
          tar -xzf "${NAME}"
          mkdir -p ~/.local/bin
          # Install the real binary under a distinct name, then wrap it so
          # that the legacy --sortedsolution flag is silently rewritten to
          # --sorted-solution (renamed in nightly >= 2026-05-29).
          cp fixpoint ~/.local/bin/fixpoint-real
          rm -f "${NAME}"
          cat > ~/.local/bin/fixpoint << 'WRAPPER'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              --sortedsolution) args+=(--sorted-solution) ;;
              *) args+=("$arg") ;;
            esac
          done
          exec ~/.local/bin/fixpoint-real "${args[@]}"
          WRAPPER
          chmod +x ~/.local/bin/fixpoint
          echo ~/.local/bin >> "$GITHUB_PATH"
          which fixpoint

      # ------------------------------------------------------------------ #
      # Install Z3 (required by Flux's constraint solving back-end)
      # Use 4.15.3 — same version as the vtock job in Flux's own CI.
      # Older versions are known to hang.
      # ------------------------------------------------------------------ #
      - name: Install Z3
        uses: cda-tum/setup-z3@v1.6.6
        with:
          version: 4.15.3

      # ------------------------------------------------------------------ #
      # Install the Rust toolchain that Flux requires (from its own
      # rust-toolchain.toml) and add the embedded target we need.
      # `rustup show` triggers toolchain installation when rust-toolchain.toml
      # is present.
      # ------------------------------------------------------------------ #
      - name: Install Flux Rust toolchain and embedded target
        working-directory: ${{ env.FLUX_DIR }}
        run: |
          rustup show
          rustup target add thumbv7em-none-eabi

      # ------------------------------------------------------------------ #
      # Cache the Flux build artefacts to avoid the ~30-minute cold build on
      # every run. The cache key is based on flux's Cargo.lock so it
      # invalidates automatically when flux's dependencies change.
      # ------------------------------------------------------------------ #
      - name: Cache Flux build
        uses: Swatinem/rust-cache@v2.8.0
        with:
          workspaces: "${{ env.FLUX_DIR }} -> ${{ env.FLUX_DIR }}/target"
          cache-on-failure: true

      # ------------------------------------------------------------------ #
      # Build and install flux + cargo-flux onto PATH.
      # Mirrors the "Install Flux" step in Flux's own vtock CI job.
      # ------------------------------------------------------------------ #
      - name: Build and install Flux
        working-directory: ${{ env.FLUX_DIR }}
        run: |
          cargo x install
          echo ~/.cargo/bin >> "$GITHUB_PATH"

      # ------------------------------------------------------------------ #
      # Replace Tock's rust-toolchain.toml with Flux's so that `cargo flux`
      # uses the correct nightly. The two repos pin different nightlies; Flux
      # supplies its own rustc so this is safe for the invariant-2 check.
      # ------------------------------------------------------------------ #
      - name: Use Flux rust-toolchain.toml
        run: |
          cp "${FLUX_DIR}/rust-toolchain.toml" rust-toolchain.toml

      # ------------------------------------------------------------------ #
      # Run Invariant 0: audit all // FLUX- annotations against the
      # committed panic_survey.json. Uses --dry-run so no source files are
      # modified; exits 1 if any markers are orphaned or malformed.
      # No binary build needed — the survey is already committed.
      # ------------------------------------------------------------------ #
      - name: Run Invariant 0 pipeline (annotation audit)
        run: |
          python3 tools/reannotate_flux.py --survey tools/panic_survey.json --dry-run

      # ------------------------------------------------------------------ #
      # Run Invariant 1: every Tock-local panic instruction in the release
      # binary is covered by a // FLUX- annotation in source.
      # Reads tools/panic_survey.json (committed) + source annotations and
      # writes tools/invariant1_report.json for the next step to consume.
      # ------------------------------------------------------------------ #
      - name: Run Invariant 1 pipeline
        run: |
          python3 tools/check_invariant1.py

      # ------------------------------------------------------------------ #
      # Run Invariant 2: no-vacuity gate.
      # Exits 0 iff gate=pass (all obligations are trusted, proven, or
      # not-proven frontier — no SILENT).
      # ------------------------------------------------------------------ #
      - name: Run Invariant 2 pipeline
        run: |
          python3 tools/check_invariant2.py

      # ------------------------------------------------------------------ #
      # Triage (issue #15): bucket every panic-root Flux error recorded by
      # invariant 2 into panicking / lookup_failed / non_panicking by whether
      # it maps to a codegened `bl panic`. Standalone post-processor — reads
      # the committed reports + survey + source and writes a `triage` block
      # back into tools/invariant2_report.json. Must run *after* check_invariant2
      # (which produces the report it augments).
      #
      # GATES (non-zero exit fails this step):
      #   - conservation: the triage must be a complete bijective partition of
      #     flux_errors[] (every E0999 represented exactly once, all bucketed).
      #     A violation is a tool bug. Non-overridable. (exit 3)
      #   - unclassified: every E0999 must match a panic-root, exclude, or
      #     tooling-error pattern (the last covers Flux inference/internal errors).
      #     A miss means a reworded/new Flux diagnostic is slipping through
      #     uncounted; update the patterns. (exit 1; --allow-unclassified to skip)
      # ------------------------------------------------------------------ #
      - name: Triage panic-root Flux errors
        run: |
          python3 tools/triage_panic_errors.py

      # ------------------------------------------------------------------ #
      # Upload the full report AND per-crate cargo flux logs as artifacts.
      # The *.baseline.log files contain the raw cargo flux output for each
      # crate — essential for diagnosing SILENT obligations.
      # ------------------------------------------------------------------ #
      - name: Upload invariant2 report and flux logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invariant2-report
          path: |
            tools/invariant1_report.json
            tools/invariant2_report.json
            tools/invariant2_logs/
