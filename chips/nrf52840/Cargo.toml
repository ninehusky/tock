[package]
name = "nrf52840"
version.workspace = true
authors.workspace = true
edition.workspace = true

[package.metadata.flux]
enabled = true
check_overflow = "lazy"
include = [
    "def:handle_interrupt",
    "def:rx",
    "def:service_interrupt",   # interrupt_service.rs — holds FLUX-TODO-BLOCKED marker
    "def:TxPower",             # nrf5x::constants::TxPower — embedded as Cell<TxPower> in the radios; must be on the include surface now that flux is enabled on nrf5x (else E0999 -> body skipped/SILENT)
]

[dependencies]
cortexm4 = { path = "../../arch/cortex-m4" }
kernel = { path = "../../kernel" }
nrf52 = { path = "../nrf52" }
# flux-rs needed so the #[flux_rs::trusted] carve-out on service_interrupt resolves
# even when nrf52840 is compiled as a dependency (e.g. by the nrf52840dk board),
# where cargo flux does not inject flux-rs. See SESSION_2026-06-01 site #2.
flux-rs = { path = "../../flux/lib/flux-rs" }
flux_support = { path = "../../flux_support" }

[lints]
workspace = true
